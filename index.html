<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas 💛</title>
    <!-- Fuentes modernas de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Sacramento&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Música -->
    <audio id="music" autoplay loop>
        <source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3" type="audio/mp3">
    </audio>

    <div class="container">
        <!-- Botón con efecto moderno -->
        <button id="startBtn">💌 Presiona aquí</button>

        <!-- Contenedor de flores -->
        <div id="flowerContainer"></div>

        <!-- Contenedor de pétalos con efecto flotante -->
        <div id="petals"></div>

        <!-- Mensaje rediseñado -->
        <div id="message">
            <span class="subtitle">Flores amarillas para Nenitos</span>
            <h1>Si pudiera elegir una persona para viajar al universo entero, sería a ti 💛</h1>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
