<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas 🌻</title>
    <!-- Fuentes de Google Fonts para un toque más actual -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Sacramento&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Música de fondo -->
    <audio id="music" autoplay loop>
        <source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3" type="audio/mp3">
    </audio>

    <div class="container">
        <!-- Botón interactivo -->
        <button id="startBtn">🏵️ Ver Regalo</button>

        <!-- Contenedor para las flores y tallos -->
        <div id="flowerContainer"></div>

        <!-- Mensaje principal -->
        <div id="message">
            <span class="subtitle">Te Amo 💐</span>
            <h1>Flores Amarillas para tí!</h1>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
